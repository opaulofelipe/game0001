<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#11100f" />
  <meta name="description" content="Protótipo narrativo sobre luto e memória." />
  <title>Coisas que Ficam — Protótipo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app" aria-label="Jogo Coisas que Ficam">
    <div id="game-shell" class="game-shell">
      <canvas id="game" width="1536" height="864" aria-label="Área do jogo"></canvas>

      <div id="loading" class="loading">
        <div class="loading-card">
          <div class="spinner" aria-hidden="true"></div>
          <p>Carregando a casa…</p>
        </div>
      </div>

      <div id="hint" class="hint" role="status" aria-live="polite"></div>
      <div id="intro-help" class="intro-help">
        <strong>Movimento:</strong> WASD ou setas &nbsp;·&nbsp; <strong>Interagir:</strong> E ou Espaço
      </div>

      <div id="debug-coords" class="debug-coords" hidden></div>

      <div class="touch-ui" aria-label="Controles de toque">
        <div class="dpad">
          <button class="touch-btn up" data-key="ArrowUp" aria-label="Andar para cima">▲</button>
          <button class="touch-btn left" data-key="ArrowLeft" aria-label="Andar para esquerda">◀</button>
          <button class="touch-btn down" data-key="ArrowDown" aria-label="Andar para baixo">▼</button>
          <button class="touch-btn right" data-key="ArrowRight" aria-label="Andar para direita">▶</button>
        </div>
        <button id="interact-btn" class="interact-btn" aria-label="Interagir">E</button>
      </div>
    </div>
  </main>

  <script src="js/scenes.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
